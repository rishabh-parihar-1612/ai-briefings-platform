name: pages-deploy

# The legacy Jekyll build pipeline stopped reacting to pushes on this repo after
# 2026-08-24 (GitHub's classic Pages build path is being retired). Switching to the
# GitHub Actions Pages pipeline: this workflow uploads the repo root as-is (no Jekyll,
# no processing) and deploys it, so new content — OnePagers/ included — actually ships.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
