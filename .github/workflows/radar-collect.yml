# Copied into the public mirror repo by scripts/publish_platform.sh.
#
# Free by construction and by necessity: this job runs NO model. GitHub Models was
# retired on 2026-07-30 (its inference API now returns HTTP 410), Copilot coding agent
# consumes premium requests, and a Claude OAuth token here would draw down the same
# subscription budget used interactively. So collection is deterministic — fetch, dedupe,
# and score against the corpus vocabulary — and the decode pass happens later, in a
# session, via `/radar --deck`. When a free model becomes available, implement
# decode_stub() in radar_collect.py; nothing else here has to change.
name: radar-collect

on:
  schedule:
    - cron: "17 1 * * *"      # 01:17 UTC, ahead of the drop and off the congested top-of-hour
  workflow_dispatch:
    inputs:
      days:
        description: "lookback window in days"
        default: "2"

permissions:
  contents: write             # commits the digest and seen.json

jobs:
  collect:
    runs-on: ubuntu-latest
    # job-level env, because the `env` context IS available in a step's `if` while
    # `secrets` is NOT — referencing secrets there fails the whole workflow at parse time
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect
        id: collect
        run: |
          set -o pipefail
          python scripts/radar_collect.py \
            --out radar-inbox \
            --vocab Deck/mirror/vocab.json \
            --lineage Deck/mirror/lineage.json \
            --days "${{ github.event.inputs.days || 2 }}" \
            | tee /tmp/summary.txt
          echo "summary=$(cat /tmp/summary.txt)" >> "$GITHUB_OUTPUT"

      - name: Commit if anything new
        id: commit
        run: |
          # a digest file only exists when something crossed the bar; the ledger and
          # seen-list update every run, and must NOT trigger a notification
          if [ -f "radar-inbox/$(date -u '+%Y-%m-%d').md" ]; then
            echo "digest=true" >> "$GITHUB_OUTPUT"
          else
            echo "digest=false" >> "$GITHUB_OUTPUT"
          fi
          git config user.name  "radar-collect"
          git config user.email "actions@github.com"
          git add radar-inbox
          if git diff --cached --quiet; then
            echo "nothing new"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -q -m "radar: $(date -u '+%Y-%m-%d') — ${{ steps.collect.outputs.summary }}"
            # A publish from the laptop, or the daily-drop job, can land on main while this
            # one is collecting — the collector takes ~2 minutes, so the window is real and
            # a bare push loses the whole run to a non-fast-forward. Rebase and retry.
            for attempt in 1 2 3; do
              if git push -q; then echo "pushed on attempt $attempt"; break; fi
              echo "push rejected — rebasing onto origin/main (attempt $attempt)"
              git pull --rebase -q origin main || { echo "rebase failed"; exit 1; }
              [ "$attempt" = 3 ] && { echo "still cannot push after 3 attempts"; exit 1; }
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Nudge Telegram
        # only when there is something to read, and never fail the job over a nudge
        if: steps.commit.outputs.digest == 'true' && env.TELEGRAM_BOT_TOKEN != ''
        continue-on-error: true
        env:
          SUMMARY: ${{ steps.collect.outputs.summary }}
          REPO: ${{ github.repository }}
        run: |
          export URL="https://github.com/${REPO}/blob/main/radar-inbox/$(date -u '+%Y-%m-%d').md"
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          text = (f"\U0001F4E1 <b>Radar</b> — {os.environ.get('SUMMARY','something crossed the bar')}\n"
                  f"Undecoded. Run <code>/radar --deck</code> to fill the lineage slots and mine cards.\n"
                  f"{os.environ['URL']}")
          data = urllib.parse.urlencode({"chat_id": os.environ["TELEGRAM_CHAT_ID"],
                                         "text": text, "parse_mode": "HTML",
                                         "disable_web_page_preview": "true"}).encode()
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage", data)
          print(urllib.request.urlopen(req, timeout=20).status)
          PY
        shell: bash

      - name: Job summary
        if: always()
        run: |
          echo "### radar-collect" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.collect.outputs.summary }}' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Source errors are recorded inside the digest itself, not hidden here." >> "$GITHUB_STEP_SUMMARY"
